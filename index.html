<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Мой сайт</title>
<!-- Можно подключить шрифты для стиля -->
<link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Montserrat:wght@600&display=swap" rel="stylesheet" />
<style>
    body {
        margin: 0;
        padding: 0;
        font-family: 'Montserrat', sans-serif;
        background: #f7f9fc;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
    }
    .wrapper {
        max-width: 800px;
        width: 100%;
        background-color: #ffffff;
        border-radius: 20px;
        box-shadow: 0 8px 20px rgba(0,0,0,0.1);
        overflow: hidden;
        display: flex;
        flex-direction: column;
    }
    /* Вставляем фотографию */
    .header-image {
        width: 100%;
        height: 250px;
        object-fit: cover;
        display: block;
    }
    /* Область контента */
    .content {
        padding: 30px;
        text-align: center;
    }
    h1 {
        font-family: 'Pacifico', cursive;
        font-size: 3em;
        margin-bottom: 10px;
        color: #ff6f61;
    }
   p {
        font-size: 1.4em;
        color: #555;
        margin-bottom: 30px;
        line-height: 1.6;
    }
    h2 {
        font-size: 2em;
        margin-bottom: 20px;
        color: #333;
        border-bottom: 2px solid #eee;
        padding-bottom: 10px;
    }
    /* Кнопки соцсетей */
    .social-links {
        display: flex;
        flex-direction: column;
        gap: 15px;
        max-width: 400px;
        margin: 0 auto 40px auto;
    }
    a {
        padding: 15px;
        background: linear-gradient(135deg, #667eea, #764ba2);
        color: #fff;
        border-radius: 12px;
        text-decoration: none;
        font-size: 1.2em;
        font-weight: 600;
        transition: all 0.3s ease;
    }
    a:hover {
        background: linear-gradient(135deg, #f7971e, #ffd200);
        transform: translateY(-3px);
        box-shadow: 0 4px 15px rgba(0,0,0,0.2);
    }
    /* футер */
    .footer {
        padding: 20px;
        font-size: 1em;
        color: #999;
        text-align: center;
        border-top: 1px solid #eee;
        background-color: #fafafa;
    }
</style>
</head>
<body>
<div class="wrapper">
    <!-- Вставьте свою фотографию сюда -->

    <div class="content">
        <h1>Привет!</h1>
        <p>Хочешь узнать обо мне больше? Тогда заходи ко мне в других соцсетях! Там ты узнаешь всё раньше, чем все остальные 😱</p>
        <h2>Мои соцсети</h2>
        <div class="social-links">

            <a href="https://t.me/romeoss6558" target="_blank">Телеграмм канал</a>
            <a href="https://t.me/romeoss6558" target="_blank">РомЧек тут</a>

            <a href="https://max.ru/join/XnFlPxxV1a6HBKtB09saNUxzHNUEm_mhXggcAO5cuDk" target="_blank">Макс канал</a>
        </div>
    </div>
    <div class="footer">
        &copy; 2026 РомЧек. Все права защищены.
    </div>
</div>

</html>
